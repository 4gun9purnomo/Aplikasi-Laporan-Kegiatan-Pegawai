<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Pentagon clipping / outline -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <path id="textPathTop" d="M 125,250 A 130,130 0 0,1 375,250" fill="none" />
    <path id="textPathBottom" d="M 375,255 A 130,130 0 0,1 125,255" fill="none" />
  </defs>

  <!-- Outer Pentagon (Yellow with Crimson/Red Border) -->
  <polygon points="250,22 475,185 390,480 110,480 25,185" fill="#FFE500" stroke="#CC1122" stroke-width="16" stroke-linejoin="round" />
  <polygon points="250,30 467,188 384,472 116,472 33,188" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6" stroke-linejoin="round" />

  <!-- Outer Circle Ring with Blue/Cyan background -->
  <circle cx="250" cy="250" r="188" fill="#FFE500" stroke="#0099DD" stroke-width="18" />
  <circle cx="250" cy="250" r="179" fill="#0099DD" />
  <circle cx="250" cy="250" r="142" fill="#FFE500" stroke="#CC8800" stroke-width="4" />

  <!-- Text Top Arc: SEKOLAH TINGGI AGAMA BUDDHA NEGERI -->
  <path id="arcTop" d="M 85,250 A 162,162 0 1,1 415,250" fill="none" />
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="16.5" fill="#111111" letter-spacing="1.2">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">
      SEKOLAH TINGGI AGAMA BUDDHA NEGERI
    </textPath>
  </text>

  <!-- Text Bottom Arc: WONOGIRI - JAWA TENGAH -->
  <path id="arcBottom" d="M 90,250 A 162,162 0 0,0 410,250" fill="none" />
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="16.5" fill="#111111" letter-spacing="1.8">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">
      ★ WONOGIRI - JAWA TENGAH ★
    </textPath>
  </text>

  <!-- Center Decorative Dharmachakra (Roda Dharma / Asoka Chakra) -->
  <g id="dharmachakra">
    <!-- Outer rim ornamentation -->
    <circle cx="250" cy="250" r="132" fill="none" stroke="#CC8800" stroke-width="2" stroke-dasharray="4,3" />
    <circle cx="250" cy="250" r="126" fill="#FFE500" stroke="#0099DD" stroke-width="5" />
    <circle cx="250" cy="250" r="110" fill="#FFE500" stroke="#CC8800" stroke-width="3" />

    <!-- 8 Dharmachakra Spokes with torch/lotus motifs -->
    <g stroke="#0099DD" stroke-width="4" fill="#FFE500">
      <!-- 0 deg (Up) -->
      <path d="M 245,215 L 243,150 L 250,140 L 257,150 L 255,215 Z" />
      <circle cx="250" cy="165" r="7" fill="#0099DD" />
      <circle cx="250" cy="148" r="4" fill="#CC8800" />

      <!-- 45 deg -->
      <g transform="rotate(45 250 250)">
        <path d="M 245,215 L 243,150 L 250,140 L 257,150 L 255,215 Z" />
        <circle cx="250" cy="165" r="7" fill="#0099DD" />
        <circle cx="250" cy="148" r="4" fill="#CC8800" />
      </g>

      <!-- 90 deg -->
      <g transform="rotate(90 250 250)">
        <path d="M 245,215 L 243,150 L 250,140 L 257,150 L 255,215 Z" />
        <circle cx="250" cy="165" r="7" fill="#0099DD" />
        <circle cx="250" cy="148" r="4" fill="#CC8800" />
      </g>

      <!-- 135 deg -->
      <g transform="rotate(135 250 250)">
        <path d="M 245,215 L 243,150 L 250,140 L 257,150 L 255,215 Z" />
        <circle cx="250" cy="165" r="7" fill="#0099DD" />
        <circle cx="250" cy="148" r="4" fill="#CC8800" />
      </g>

      <!-- 180 deg -->
      <g transform="rotate(180 250 250)">
        <path d="M 245,215 L 243,150 L 250,140 L 257,150 L 255,215 Z" />
        <circle cx="250" cy="165" r="7" fill="#0099DD" />
        <circle cx="250" cy="148" r="4" fill="#CC8800" />
      </g>

      <!-- 225 deg -->
      <g transform="rotate(225 250 250)">
        <path d="M 245,215 L 243,150 L 250,140 L 257,150 L 255,215 Z" />
        <circle cx="250" cy="165" r="7" fill="#0099DD" />
        <circle cx="250" cy="148" r="4" fill="#CC8800" />
      </g>

      <!-- 270 deg -->
      <g transform="rotate(270 250 250)">
        <path d="M 245,215 L 243,150 L 250,140 L 257,150 L 255,215 Z" />
        <circle cx="250" cy="165" r="7" fill="#0099DD" />
        <circle cx="250" cy="148" r="4" fill="#CC8800" />
      </g>

      <!-- 315 deg -->
      <g transform="rotate(315 250 250)">
        <path d="M 245,215 L 243,150 L 250,140 L 257,150 L 255,215 Z" />
        <circle cx="250" cy="165" r="7" fill="#0099DD" />
        <circle cx="250" cy="148" r="4" fill="#CC8800" />
      </g>
    </g>

    <!-- Center Hub -->
    <circle cx="250" cy="250" r="42" fill="#FFE500" stroke="#0099DD" stroke-width="6" />
    <circle cx="250" cy="250" r="34" fill="#FFE500" stroke="#CC8800" stroke-width="3" />
    <circle cx="250" cy="250" r="18" fill="#0099DD" />
  </g>

  <!-- Banner / Text "RADEN WIJAYA" in the center -->
  <g>
    <rect x="135" y="235" width="230" height="30" rx="4" fill="#FFE500" opacity="0.92" />
    <text x="250" y="257" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="22" fill="#221100" text-anchor="middle" letter-spacing="1.5">
      RADEN WIJAYA
    </text>
  </g>
</svg>
